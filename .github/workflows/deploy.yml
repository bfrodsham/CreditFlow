name: Build, Test, and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore CreditFlow.slnx

      - name: Build
        run: dotnet build CreditFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CreditFlow.slnx --no-build --configuration Release --verbosity normal

  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deploy on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"